name: Deploy

# Publica el sitio en GitHub Pages con cada push a main.
# `workflow_dispatch` permite relanzarlo a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos que pide el deploy oficial de Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Si entran dos pushes seguidos, que gane el último; no cancela uno a medio publicar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` respeta package-lock.json; falla si quedó desincronizado.
      - run: npm ci

      # El script de build corre `tsc -b` antes de Vite: si no tipa, no se publica.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
